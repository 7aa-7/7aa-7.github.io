<!DOCTYPE html>
<html>
  <head>
    <title>Bread</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="/icon.png">
  </head>
  <body>
    <div class="header">
    
      <p>Header</p>
    
    </div>
  
    <div class="main" >
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYMd8YK4ftCInvPjtQWcNuiKMXCBXZ3AqF_YG6yUeo4Q&s=10" class="person_image">
      <h1 class="person_name">Logan H.</h1>
      <br>
      <form>

        <fieldset>
          <legend>What type of bread do you want</legend>

          <label>
            <input type="radio" value="rye" name="bread_type">Rye
          </label>

          <label>
            <input type="radio" value="white" name="bread_type">White
          </label>

          <label>
            <input type="radio" value="sourdough" name="bread_type">Sourdough
          </label>

        </fieldset>

        <fieldset>
          <legend>How do you want it cooked</legend>

          <label>
            <input type="radio" value="raw" name="bread_cooked">Raw
          </label>

          <label>
            <input type="radio" value="toasted" name="bread_cooked">Toasted
          </label>

          <label>
            <input type="radio" value="burnt" name="bread_cooked">Burnt to a crisp
          </label>

        </fieldset>

        <fieldset>
          <legend>How good should it be</legend>

          <label>
            <input type="radio" value="bad" name="bread_quality">Bad
          </label>

          <label>
            <input type="radio" value="medium" name="bread_quality">Medium
          </label>

          <label>
            <input type="radio" value="good" name="bread_quality">Good
          </label>

        </fieldset>

      </form>
    </div>
  
    </div>

    <script src="script.js"></script>
  </body>
</html>
